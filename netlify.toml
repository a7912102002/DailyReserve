[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/items"
  to = "/.netlify/functions/items"
  status = 200

[[redirects]]
  from = "/api/items/*"
  to = "/.netlify/functions/items/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

